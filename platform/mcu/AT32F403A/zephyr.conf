#
# Zephyr configuration shared by all the OpenRTX targets based on the
# Artery AT32F403A MCU (ArteryTek Zephyr fork, see west.yml "artery" group).
# Board-specific options belong to platform/targets/<board>/<board>_defconfig.
#

# SoC peripherals
CONFIG_CLOCK_CONTROL=y
CONFIG_RESET=y
CONFIG_PINCTRL=y
CONFIG_GPIO=y
CONFIG_SERIAL=y

# Internal flash, accessed through the flash map by the NVM driver
CONFIG_FLASH=y
CONFIG_FLASH_PAGE_LAYOUT=y
CONFIG_FLASH_MAP=y

# The application is chain-loaded by the vendor bootloader: bring the NVIC,
# SysTick and MPU back to their reset state before starting the kernel.
CONFIG_INIT_ARCH_HW_AT_BOOT=y

# Cortex-M4F
CONFIG_FPU=y

# Kernel
CONFIG_MAIN_STACK_SIZE=3072
CONFIG_ISR_STACK_SIZE=1024
CONFIG_IDLE_STACK_SIZE=320
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=1024

# C/C++ runtime. OpenRTX allocates its thread stacks with malloc(), newlib
# uses all the RAM left after .bss as heap.
CONFIG_NEWLIB_LIBC=y
CONFIG_CPP=y
CONFIG_REQUIRES_FULL_LIBCPP=y
CONFIG_STD_CPP14=y

# POSIX threads, mutexes and condition variables used by the OpenRTX core
CONFIG_POSIX_AEP_CHOICE_BASE=y
CONFIG_POSIX_THREAD_ATTR_STACKSIZE=y
CONFIG_POSIX_THREAD_PRIORITY_SCHEDULING=y
CONFIG_POSIX_THREAD_THREADS_MAX=6
CONFIG_MAX_PTHREAD_MUTEX_COUNT=16
CONFIG_MAX_PTHREAD_COND_COUNT=8

# Console and logging
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y
CONFIG_PRINTK=y
CONFIG_PRINTK_SYNC=y
CONFIG_LOG=y
CONFIG_LOG_PRINTK=y
CONFIG_LOG_MODE_IMMEDIATE=y
CONFIG_LOG_BACKEND_UART=y
